services:
  web:
    build: .
    image: moviematch
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
